version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 breaks next build; take it when Next supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types should not run ahead of the runtime CI pins (Node 24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
